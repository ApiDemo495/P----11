name: boot
on:
  push:
    branches: ["arena/**"]
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: devcontainer sanity
        run: |
          python3 -c "
          import json
          d = json.load(open('.devcontainer/devcontainer.json'))
          assert d['waitFor'] == 'onCreateCommand'
          for h in ('onCreateCommand','postCreateCommand','postStartCommand','postAttachCommand'):
              assert 'start.py --detach' in d[h], h
          assert 'visibility' not in d['portsAttributes']['8000']  # spec has no such key; gh CLI in start.py enforces public
          print('devcontainer OK')"
      - name: boot via start.py (the exact Codespace path)
        run: |
          python3 start.py --detach
          python3 - <<'PY'
          import json, time, urllib.request
          deadline = time.time() + 600
          t0 = time.time()
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/", timeout=3) as r:
                      assert r.status == 200          # placeholder or app: never dead
              except Exception as e:
                  # the placeholder binds within seconds of detach;
                  # a refused connection in that first grace window
                  # is the runner's startup lag, not a dead port
                  if time.time() - t0 < 90:
                      time.sleep(1); continue
                  # dump the boot/server logs before dying so a
                  # failure is diagnosable from the job log itself
                  for f in ("data/boot.log", "data/server.log"):
                      try:
                          print(f"--- tail {f} ---")
                          print("".join(open(f, errors="replace")
                                        .readlines()[-40:]))
                      except OSError:
                          print(f"--- no {f} ---")
                  raise SystemExit(f"port dead during boot: {e}")
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3) as r:
                      if json.load(r).get("ok"):
                          print("app healthy")
                          break
              except Exception:
                  pass
              time.sleep(5)
          else:
              for f in ("data/boot.log", "data/server.log"):
                  try:
                      print(f"--- tail {f} ---")
                      print("".join(open(f, errors="replace")
                                    .readlines()[-40:]))
                  except OSError:
                      print(f"--- no {f} ---")
              raise SystemExit("app never became healthy")
          PY
      - name: stop
        if: always()
        run: python3 start.py --stop || true
